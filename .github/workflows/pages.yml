name: Publish MkDocs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate answer pages
        run: python scripts/check_answers.py

      - name: Validate project pages
        run: python scripts/check_projects.py

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Install personal site dependencies
        run: pip install -r personal-site/requirements.txt

      - name: Test personal site
        run: python -m unittest discover -s personal-site -p 'test_*.py'

      - name: Build bilingual personal site in its own directory
        run: python personal-site/build.py --output site/damjan

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
